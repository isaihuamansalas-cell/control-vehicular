<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniConnect - Inicio de Sesión</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="login-container">

    <section class="login-card">
      <h1>UniConnect</h1>
      <p class="subtitle">Sistema Integral Universitario</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo institucional</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Ingrese su correo"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Ingrese su contraseña"
            required
          >
        </div>

        <button type="submit">Ingresar</button>
      </form>

      <p id="loginMessage" class="message"></p>

      <div class="test-users">
        <h3>Usuarios de prueba</h3>
        <p><strong>Admin:</strong> admin@uni.edu / 123456</p>
        <p><strong>Profesor:</strong> profesor@uni.edu / 123456</p>
        <p><strong>Alumno:</strong> alumno@uni.edu / 123456</p>
        <p><strong>Seguridad:</strong> seguridad@uni.edu / 123456</p>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
</body>
</html>
