<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniConnect - Gestión de Usuarios</title>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dashboard-body">

  <header class="topbar">
    <div>
      <h2>UniConnect</h2>
      <p>Gestión de usuarios</p>
    </div>

    <div class="topbar-actions">
      <button id="backBtn" class="secondary-btn">Volver</button>
      <button id="logoutBtn" class="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="dashboard-container">

    <section class="welcome-card">
      <h1>Registro de usuarios</h1>
      <p>Desde aquí el administrador puede registrar alumnos, profesores y personal de seguridad.</p>
    </section>

    <section class="form-section">
      <h2>Nuevo usuario</h2>

      <form id="userForm" class="user-form">

        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombres y apellidos</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-group">
            <label for="dni">DNI</label>
            <input type="text" id="dni" maxlength="8" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Correo institucional</label>
            <input type="email" id="email" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="rol">Rol</label>
            <select id="rol" required>
              <option value="">Seleccione un rol</option>
              <option value="Administrador">Administrador</option>
              <option value="Profesor">Profesor</option>
              <option value="Alumno">Alumno</option>
              <option value="Seguridad">Seguridad</option>
            </select>
          </div>

          <div class="form-group">
            <label for="area">Área académica</label>
            <select id="area" required>
              <option value="">Seleccione un área</option>
              <option value="Ingenierías">Ingenierías</option>
              <option value="Ciencias de la Salud">Ciencias de la Salud</option>
              <option value="Humanidades">Humanidades</option>
              <option value="Ciencias Empresariales">Ciencias Empresariales</option>
              <option value="Educación">Educación</option>
              <option value="Seguridad Universitaria">Seguridad Universitaria</option>
              <option value="Administración">Administración</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="aula">Aula / Curso / Sección</label>
            <input type="text" id="aula" placeholder="Ejemplo: Aula 302 / Matemática I">
          </div>

          <div class="form-group">
            <label for="foto">Foto de perfil</label>
            <input type="file" id="foto" accept="image/*">
          </div>
        </div>

        <button type="submit">Guardar usuario</button>
      </form>

      <p id="userMessage" class="message"></p>
    </section>

    <section class="table-section">
      <h2>Usuarios registrados</h2>

      <div class="search-box">
        <input type="text" id="searchUser" placeholder="Buscar por nombre, DNI, correo o rol...">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Nombre</th>
              <th>DNI</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Área</th>
              <th>Aula/Curso</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <!-- Aquí aparecerán los usuarios -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
</body>

</html>
